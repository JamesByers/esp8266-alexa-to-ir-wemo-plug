; PlatformIO Project Configuration File
; ESP8266 Alexa to IR Controller (Wemo Plug Emulation with FauxmoESP 2.4.3)

[env:nodemcuv2]
board = nodemcuv2
platform = espressif8266

framework = arduino
monitor_speed = 115200

; Standard ESP8266 flashing rate; verified working on this board.
; Do NOT use the 9600 printed on the board silkscreen -- the bootloader
; rejects it with "Invalid (unsupported) command 0x8".
upload_speed = 115200

; Pinned explicitly: auto-detect picks /dev/cu.Bluetooth-Incoming-Port instead.
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001

lib_deps =
    https://github.com/vintlabs/fauxmoESP.git#2.4.3
    me-no-dev/ESPAsyncTCP@^1.2.2
    crankyoldgit/IRremoteESP8266@^2.8.6
