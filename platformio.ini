; PlatformIO Project Configuration File
; ESP8266 Alexa to IR Controller (Wemo Plug Emulation with FauxmoESP 2.2.1)

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200

lib_deps =
    vintlabs/FauxmoESP@2.2.1
    crankyoldgit/IRremoteESP8266@^2.8.6
