; PlatformIO Project Configuration File
; ESP8266 Alexa to IR Controller (Sinric Pro cloud skill)

[env:nodemcuv2]
board = nodemcuv2
platform = espressif8266

framework = arduino
monitor_speed = 115200

; Standard ESP8266 flashing rate; verified working on this board.
; Do NOT use the 9600 printed on the board silkscreen -- the bootloader
; rejects it with "Invalid (unsupported) command 0x8".
upload_speed = 115200

; Pinned explicitly: auto-detect picks /dev/cu.Bluetooth-Incoming-Port instead.
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001

; Devices reach Alexa through the Sinric Pro skill rather than local WeMo
; emulation. Alexa completed WeMo discovery against this board (all three
; setup.xml fetches succeeded) but never registered the devices -- see
; vintlabs/fauxmoESP#288. lib/FauxmoESP_2.4.3_Patched is kept in the repo for
; reference but is no longer built; SinricPro's TLS websocket needs the RAM.
lib_deps =
    sinricpro/SinricPro@^5.1.0
    crankyoldgit/IRremoteESP8266@^2.8.6
