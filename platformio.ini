; PlatformIO Project Configuration File
; ESP8266 Alexa to IR Controller (Wemo Plug Emulation with FauxmoESP 2.4.3)

[env:nodemcuv2]
board = nodemcuv2
platform = espressif8266

framework = arduino
monitor_speed = 115200

; Standard ESP8266 flashing rate; verified working on this board.
; Do NOT use the 9600 printed on the board silkscreen -- the bootloader
; rejects it with "Invalid (unsupported) command 0x8".
upload_speed = 115200

; Pinned explicitly: auto-detect picks /dev/cu.Bluetooth-Incoming-Port instead.
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001

; Enables fauxmoESP's [FAUXMO] diagnostics (M-SEARCH received, UDP replies,
; /setup.xml fetches, client connects) -- needed to see how far Alexa gets.
build_flags =
    -DDEBUG_FAUXMO=Serial

; Vendored fauxmoESP 2.4.3 (upstream tag) with one local fix: the UDP read
; buffer in handle() is len+1 bytes, because _onUDPData() NUL-terminates at
; p[len]. Vendored rather than pulled from GitHub so the patch is tracked in
; git and survives dependency reinstalls.
lib_deps =
    symlink://lib/FauxmoESP_2.4.3_Patched
    me-no-dev/ESPAsyncTCP@^1.2.2
    crankyoldgit/IRremoteESP8266@^2.8.6
